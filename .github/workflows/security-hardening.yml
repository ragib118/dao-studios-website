name: Security hardening checks

on:
  push:
    branches:
      - security-hardening-2026-08

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and apply safe autofixes
        run: npm run lint -- --fix

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy

      - name: Commit generated fixes
        if: success()
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply verified security hardening fixes [skip ci]"
          git push
